apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-cloud-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'postgres-database'
        static_configs:
          - targets: ['postgres-service:9187']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-cloud-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-cloud
  template:
    metadata:
      labels:
        app: prometheus-cloud
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
        ports:
        - containerPort: 9090
        resources:
          limits:
            memory: "150Mi"
            cpu: "100m"
          requests:
            memory: "100Mi"
            cpu: "50m"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: storage-volume
          mountPath: /prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-cloud-config
      - name: storage-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-cloud-service
  namespace: default
spec:
  selector:
    app: prometheus-cloud
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-cloud-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-cloud
  template:
    metadata:
      labels:
        app: grafana-cloud
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.0.0
        ports:
        - containerPort: 3000
        resources:
          limits:
            memory: "150Mi"
            cpu: "100m"
          requests:
            memory: "100Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-cloud-service
  namespace: default
spec:
  selector:
    app: grafana-cloud
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer

