apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-local-deployment
  labels:
    app: grafana-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-local
  template:
    metadata:
      labels:
        app: grafana-local
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.0.0
        ports:
        - containerPort: 3000
          name: grafana-port
        # Strict Resource Limits: Prevents local laptop memory exhaustion
        resources:
          limits:
            memory: "150Mi"
            cpu: "100m"
          requests:
            memory: "100Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-local-service
spec:
  selector:
    app: grafana-local
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP

