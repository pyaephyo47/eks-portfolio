apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
      - name: custom-frontend
        image: pyaephyomaung47/multi-page-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: frontend-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        # 📂 MOUNT INJECTION: Drops the status file configuration into Nginx's active directory
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      # 🔄 THE NGINX SIDECAR TRANSLATOR: Reads Nginx text rows and exposes metrics on port 9113
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.0.0
        args:
          - "-nginx.scrape-uri=http://127.0.0.1"
        ports:
        - containerPort: 9113
          name: nginx-metrics
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
          requests:
            memory: "32Mi"
            cpu: "50m"
      # 🗄️ THE VOLUME SOURCE: Points to your configMap file asset
      volumes:
      - name: config-volume
        configMap:
          name: nginx-status-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: nginx-metrics
      protocol: TCP
      port: 9113
      targetPort: 9113
  type: NodePort

