apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-local-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      # 🔗 DATABASE TARGET: Automatically scrapes your Postgres sidecar every 5 seconds!
      - job_name: 'postgres-database'
        static_configs:
          - targets: ['postgres-service:9187']

      # 🔗 WEBSITE TRAFFIC TARGET: Automatically scrapes your Nginx sidecar traffic metrics!
      - job_name: 'frontend-nginx-web'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['frontend-service:9113']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-local-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-local
  template:
    metadata:
      labels:
        app: prometheus-local
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
        ports:
        - containerPort: 9090
        # Strict Resource Limits: Caps RAM to keep your laptop cool and fast!
        resources:
          limits:
            memory: "150Mi"
            cpu: "100m"
          requests:
            memory: "80Mi"
            cpu: "50m"
        volumeMounts:
        # 📂 FIXED: Single, unique config file mount entry point
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: storage-volume
          mountPath: /prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-local-config
      - name: storage-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-local-service
spec:
  selector:
    app: prometheus-local
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP

